<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Chest Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cyan:#25f4ee; --red:#fe2c55; --gold:#ffc83d; --ink:#161823; --muted:rgba(22,24,35,.6);
  --k:1;  /* size scale: 1 on phones, bigger on tablets (set by the script) */
  --gl:14px; --gr:14px; --gt:14px; --gb:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff}
@supports (padding:max(0px)){:root{
  --gl:max(14px,env(safe-area-inset-left,0px)); --gr:max(14px,env(safe-area-inset-right,0px));
  --gt:max(14px,env(safe-area-inset-top,0px)); --gb:max(16px,env(safe-area-inset-bottom,0px))}}
@supports (-webkit-touch-callout:none){html,body{height:-webkit-fill-available}}
@supports (height:100dvh){html,body{height:100dvh}}
body{font-family:var(--font);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* Phones and tablets: full screen. Computers (mouse): a centred phone */
.app{height:100%;display:flex;align-items:center;justify-content:center;background:#fff}
.game{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 60% at 0% 0%,rgba(37,244,238,.14),transparent 60%),radial-gradient(120% 60% at 100% 100%,rgba(254,44,85,.1),transparent 60%),#fff}
@media (min-aspect-ratio:10/16) and (min-height:501px) and (hover:hover) and (pointer:fine){
  .app{padding:12px;background:radial-gradient(60% 50% at 30% 20%,rgba(37,244,238,.12),transparent),radial-gradient(60% 50% at 70% 80%,rgba(254,44,85,.1),transparent),#f1f1f2}
  .game{width:auto;height:100%;max-height:940px;aspect-ratio:9/19.5;max-width:100%;border-radius:30px;box-shadow:0 30px 70px rgba(22,24,35,.18),0 0 0 1px rgba(22,24,35,.08)}
  @supports not (aspect-ratio:1/1){.game{width:calc((100vh - 24px) * .4615);max-width:434px}}
}
@media (min-aspect-ratio:10/16) and (min-height:800px) and (hover:hover) and (pointer:fine){.app{padding:24px}}
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  .rotate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;color:#161823;font-weight:800;font-size:18px;text-align:center;padding:20px}
  .rotate i{font-style:normal;font-size:46px;animation:turn 1.6s ease-in-out infinite}
}

/* HUD */
.coins{position:absolute;top:calc(8px*var(--k));top:max(calc(8px*var(--k)),env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:calc(8px*var(--k));height:calc(52px*var(--k));padding:0 calc(20px*var(--k)) 0 calc(6px*var(--k));border-radius:999px;
  background:#f1f1f2;font-size:calc(26px*var(--k));font-weight:900;font-variant-numeric:tabular-nums;
  text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red);box-shadow:inset 0 0 0 1.5px rgba(22,24,35,.06),0 calc(4px*var(--k)) calc(14px*var(--k)) rgba(22,24,35,.08);white-space:nowrap}
.coins .coin{width:calc(42px*var(--k));height:calc(42px*var(--k))}
.coins.bump{animation:bumpC .3s}
.coin{display:inline-block;flex:none;width:30px;height:30px}
.coin img{display:block;width:100%;height:100%;object-fit:contain}

/* Board */
#board{position:absolute;left:0;top:0;z-index:2;display:block;touch-action:none}
.hint{position:absolute;left:0;right:0;z-index:6;text-align:center;font-weight:800;font-size:calc(15px*var(--k));color:var(--muted);pointer-events:none;transition:opacity .4s;animation:nudge 1.4s ease-in-out infinite}
.hint.off{opacity:0;animation:none}
.plus{position:absolute;z-index:8;transform:translate(-50%,-50%);font-size:calc(26px*var(--k));font-weight:900;pointer-events:none;white-space:nowrap;
  text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red);animation:rise 1s ease-out forwards}
.flycoin{position:absolute;z-index:40;width:calc(30px*var(--k));height:calc(30px*var(--k));pointer-events:none;transition:transform .55s cubic-bezier(.5,0,.6,1),opacity .2s .45s}
.flycoin img{width:100%;height:100%}

/* D-pad */
.pad{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + calc(6px*var(--k)));z-index:6;display:grid;grid-template-columns:repeat(3,calc(84px*var(--k)));grid-template-rows:repeat(2,calc(74px*var(--k)));gap:calc(8px*var(--k))}
.pad button{border-radius:calc(18px*var(--k));background:#f1f1f2;box-shadow:inset 0 0 0 1.5px rgba(22,24,35,.07),0 calc(3px*var(--k)) 0 rgba(22,24,35,.08);display:grid;place-items:center}
.pad button.tip{background:#fff;box-shadow:inset 0 0 0 calc(3px*var(--k)) var(--red),calc(-3px*var(--k)) 0 0 var(--cyan),0 calc(8px*var(--k)) calc(20px*var(--k)) rgba(254,44,85,.35);animation:tip 1s ease-in-out infinite}
.pad button.tip svg{fill:var(--red)}
.pad button:active,.pad button.on{background:var(--red);box-shadow:-3px 0 0 var(--cyan);transform:translateY(2px)}
.pad button:active svg,.pad button.on svg{fill:#fff}
.pad svg{width:calc(38px*var(--k));height:calc(38px*var(--k));fill:var(--ink)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}

/* Cards and screens */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:calc(16px*var(--k));overflow-y:auto;
  padding:calc(80px*var(--k)) var(--gr) var(--gb) var(--gl);background:rgba(255,255,255,.86);animation:fade .25s}
.modal,.screen{overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
.modal::-webkit-scrollbar,.screen::-webkit-scrollbar{display:none}
.fx{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;overflow:hidden;pointer-events:none}
.roll{display:inline-grid;justify-items:end}
.roll>span{grid-area:1/1;white-space:nowrap}
.roll>.g{visibility:hidden}
.modal>:first-child{margin-top:auto}.modal>:last-child{margin-bottom:auto}.modal>*{flex-shrink:0;max-width:100%}
.pane{width:min(calc(330px*var(--k)),100%);padding:calc(22px*var(--k)) calc(20px*var(--k)) calc(24px*var(--k));border-radius:calc(20px*var(--k));background:#fff;text-align:center;
  box-shadow:-4px 0 0 var(--cyan),4px 0 0 var(--red),0 calc(20px*var(--k)) calc(40px*var(--k)) rgba(22,24,35,.18);animation:cardin .45s cubic-bezier(.3,1.5,.5,1)}
.pane h2{margin:0;font-size:calc(28px*var(--k));font-weight:900;line-height:1.15}
.pane p{margin:calc(8px*var(--k)) 0 0;font-size:calc(15px*var(--k));font-weight:600;color:var(--muted)}
.pane .big{width:calc(120px*var(--k));height:auto;margin:calc(10px*var(--k)) auto 0;display:block;animation:wob 1.4s ease-in-out infinite}
.reward{display:flex;align-items:center;justify-content:center;gap:calc(8px*var(--k));margin-top:calc(8px*var(--k));font-size:calc(46px*var(--k));font-weight:900;font-variant-numeric:tabular-nums;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.reward .coin{width:calc(50px*var(--k));height:calc(50px*var(--k))}
.actions{display:grid;grid-template-columns:minmax(0,1fr);gap:calc(10px*var(--k));width:min(calc(330px*var(--k)),100%)}
.actions>*{min-width:0;width:100%}
.btn{height:calc(56px*var(--k));border-radius:calc(8px*var(--k));font-size:calc(18px*var(--k));font-weight:800}
.btn.y{background:var(--red);color:#fff;box-shadow:-4px 0 0 var(--cyan)}
.btn.w{background:#f1f1f2;border:1px solid rgba(22,24,35,.08);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:calc(16px*var(--k));text-align:center;overflow-y:auto;
  padding:calc(30px*var(--k)) var(--gr) var(--gb) var(--gl);background:radial-gradient(100% 50% at 0% 0%,rgba(37,244,238,.18),transparent 60%),radial-gradient(100% 50% at 100% 100%,rgba(254,44,85,.12),transparent 60%),#fff;animation:fade .25s}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}.screen>*{flex-shrink:0;max-width:100%}
.screen h1{margin:0;font-size:calc(44px*var(--k));font-weight:900;line-height:1;text-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--red)}
.screen h2{margin:0;font-size:calc(28px*var(--k));font-weight:900;line-height:1.15}
.screen p{margin:0;font-size:calc(16px*var(--k));font-weight:600;color:var(--muted);max-width:calc(320px*var(--k))}
.screen p b{color:var(--ink)}
.goal{font-size:calc(22px*var(--k))!important;font-weight:900!important;color:var(--ink)!important;line-height:1.25}
.train{display:flex;align-items:flex-end;justify-content:center;height:calc(110px*var(--k))}
.train img{width:calc(62px*var(--k));height:auto;margin:0 calc(-6px*var(--k));animation:hop 1s ease-in-out infinite}
.train img:nth-child(2){animation-delay:.12s}.train img:nth-child(3){animation-delay:.24s}.train img:nth-child(4){width:calc(80px*var(--k));animation-delay:.36s}
.train .coin{width:calc(46px*var(--k));height:calc(46px*var(--k));margin-left:calc(18px*var(--k));margin-bottom:calc(14px*var(--k));animation:bob 1s ease-in-out infinite alternate}
.how{display:grid;gap:calc(8px*var(--k));width:min(calc(330px*var(--k)),100%)}
.how div{display:flex;align-items:center;gap:calc(12px*var(--k));padding:calc(11px*var(--k)) calc(14px*var(--k));border-radius:calc(10px*var(--k));background:#f1f1f2;font-weight:700;font-size:calc(15px*var(--k));text-align:left}
.how em{font-style:normal}
.how span{flex:none;width:calc(30px*var(--k));text-align:center;font-size:calc(20px*var(--k))}
.amount{display:flex;align-items:center;gap:calc(10px*var(--k));font-size:calc(46px*var(--k));font-weight:900;font-variant-numeric:tabular-nums;text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.amount .coin{width:calc(50px*var(--k));height:calc(50px*var(--k))}
.field{display:flex;align-items:center;width:100%;height:calc(56px*var(--k));padding:0 calc(16px*var(--k));border-radius:calc(8px*var(--k));background:#f1f1f2;box-shadow:inset 0 0 0 1.5px rgba(22,24,35,.1)}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--cyan),3px 0 0 var(--red)}
.field.bad{animation:nope .3s;box-shadow:inset 0 0 0 2px var(--red)}
.field span{font-size:calc(20px*var(--k));font-weight:800;color:var(--muted)}
.field input{flex:1;min-width:0;width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font-family:inherit;font-size:max(16px,calc(19px*var(--k)));font-weight:700;padding:0 0 0 2px;
  user-select:text;-webkit-user-select:text;touch-action:manipulation}
.field input::placeholder{color:rgba(22,24,35,.35)}
.field input.fill{animation:fillin .35s ease-out}
.paste{flex:none;height:calc(34px*var(--k));padding:0 calc(14px*var(--k));margin-right:-6px;border-radius:calc(6px*var(--k));background:var(--red);color:#fff;font-size:calc(14px*var(--k));font-weight:800;box-shadow:-3px 0 0 var(--cyan)}
.paste:active{transform:scale(.95)}
.hint2{min-height:calc(18px*var(--k));font-size:calc(13px*var(--k))!important;color:#e0173f!important}
.spinner{width:calc(58px*var(--k));height:calc(58px*var(--k));border-radius:50%;border:calc(6px*var(--k)) solid rgba(22,24,35,.08);border-top-color:var(--red);border-left-color:var(--cyan);animation:spin .8s linear infinite}
.load{width:min(calc(280px*var(--k)),100%);height:calc(6px*var(--k));border-radius:99px;background:rgba(22,24,35,.08);overflow:hidden}
.load i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--red));animation:loadbar 1.8s ease-in-out forwards}
.prank-text{font-size:calc(34px*var(--k));font-weight:900;line-height:1.15;text-transform:uppercase;text-shadow:-3px -1px 0 var(--cyan),3px 1px 0 var(--red)}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:25}

@keyframes pulse{50%{box-shadow:-4px 0 0 var(--cyan),0 10px 34px rgba(254,44,85,.6);transform:scale(1.03)}}
@keyframes fade{from{opacity:0}}
@keyframes nudge{50%{opacity:.45}}
@keyframes bumpC{50%{transform:translateX(-50%) scale(1.15)}}
@keyframes rise{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-70px}}
@keyframes cardin{from{transform:scale(.6);opacity:0}}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.05)}}
@keyframes hop{50%{transform:translateY(-12px)}}
@keyframes bob{to{transform:translateY(-10px) scale(1.08)}}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fillin{from{opacity:0;transform:translateY(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loadbar{to{width:100%}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (max-height:640px){.screen h1{font-size:34px}.train{height:84px}.how div{padding:8px 12px;font-size:14px}.screen{gap:12px}}
@media (max-height:640px){.pad{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,62px)}.pad svg{width:30px;height:30px}}
/* congratulations + nickname screen */
#win{bottom:auto;height:var(--askH,100%);gap:calc(12px*var(--k));padding-top:calc(72px*var(--k));padding-bottom:max(12px,var(--gb))}
#win .pane{padding:calc(16px*var(--k)) calc(18px*var(--k)) calc(18px*var(--k))}
#win .pane h2{font-size:calc(24px*var(--k))}
#win .pane .big{width:calc(84px*var(--k));margin-top:calc(6px*var(--k))}
#win .reward{font-size:calc(40px*var(--k));margin-top:calc(4px*var(--k))}
#win .reward .coin{width:calc(44px*var(--k));height:calc(44px*var(--k))}
#win .pane p{font-size:calc(14px*var(--k));margin-top:calc(6px*var(--k))}
#win .actions{gap:calc(8px*var(--k))}
#win .hint2{margin:0;min-height:calc(14px*var(--k))}
@media (max-width:359px){#win .pane h2{font-size:21px}}
#win .btn{height:calc(52px*var(--k))}
#win .btn.w{height:calc(46px*var(--k))}
/* keyboard open (set by the script) or very low screens: compact */
#win.kb{gap:6px;padding-top:62px;padding-bottom:8px}
#win.kb .actions{gap:6px}#win.kb .hint2{min-height:12px}
#win.kb .big,#win.kb #askText,#win.kb .btn.w{display:none}
#win.kb .pane{padding:8px 16px 10px}#win.kb h2{font-size:20px}#win.kb .reward{font-size:34px}#win.kb .reward .coin{width:36px;height:36px}
#win.kb .btn{height:46px;font-size:16px}#win.kb .field{height:48px}
@media (max-height:640px){#win .pane .big{width:60px}#win #askText{display:none}}
@media (max-height:520px){#win .big,#win #askText,#win .btn.w{display:none}#win{padding-top:64px;gap:8px}}
/* --- extra visuals --- */
#board{box-shadow:calc(-4px*var(--k)) 0 0 var(--cyan),calc(4px*var(--k)) 0 0 var(--red),0 calc(18px*var(--k)) calc(40px*var(--k)) rgba(22,24,35,.16)}
.deco{position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;overflow:hidden;pointer-events:none}
.deco .blob{position:absolute;border-radius:50%;will-change:transform;animation:drift 10s ease-in-out infinite alternate}
.deco .b1{width:70%;height:38%;left:-20%;top:4%;background:radial-gradient(closest-side,rgba(37,244,238,.38),rgba(37,244,238,0))}
.deco .b2{width:65%;height:34%;right:-20%;bottom:6%;background:radial-gradient(closest-side,rgba(254,44,85,.3),rgba(254,44,85,0));animation-delay:-5s}
.screen>.deco+*{margin-top:auto}
.screen>*:not(.deco){position:relative;z-index:1}
.praise{position:absolute;left:0;right:0;z-index:7;text-align:center;font-weight:900;font-size:calc(34px*var(--k));line-height:1;pointer-events:none;color:var(--ink);
  text-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--red);animation:praise 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes praise{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.12)}35%{transform:scale(1)}75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-24px)}}
@keyframes tip{50%{transform:translateY(calc(-4px*var(--k))) scale(1.06)}}
@keyframes drift{to{transform:translate(10%,6%) scale(1.12)}}
@keyframes floaty{50%{transform:translateY(-16px) rotate(14deg)}}
@keyframes twinkle{to{opacity:.15;transform:scale(.5) rotate(40deg)}}
/* "WIN & GET" plate */
.winbar{position:absolute;left:50%;top:calc(72px*var(--k));top:calc(max(calc(8px*var(--k)),env(safe-area-inset-top,0px)) + calc(64px*var(--k)));z-index:5;transform:translateX(-50%);
  display:flex;align-items:center;gap:calc(8px*var(--k));height:calc(46px*var(--k));padding:0 calc(18px*var(--k)) 0 calc(20px*var(--k));border-radius:calc(12px*var(--k));overflow:hidden;white-space:nowrap;
  background:linear-gradient(135deg,#232533,#161823);color:#fff;font-weight:900;font-size:calc(19px*var(--k));letter-spacing:.05em;
  box-shadow:calc(-3px*var(--k)) 0 0 var(--cyan),calc(3px*var(--k)) 0 0 var(--red),0 calc(10px*var(--k)) calc(24px*var(--k)) rgba(22,24,35,.28);animation:wbpulse 2.2s ease-in-out infinite}
.winbar span:first-child{text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--red)}
.winbar .coin{width:calc(32px*var(--k));height:calc(32px*var(--k))}
.winbar b{color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 calc(10px*var(--k)) rgba(255,200,61,.55)}
.winbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;transform:translateX(-150%);will-change:transform;background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);animation:shine 2.6s ease-in-out infinite}
@keyframes wbpulse{50%{transform:translateX(-50%) scale(1.04)}}
@keyframes shine{55%,100%{transform:translateX(325%)}}
/* background: spinning light rays, dotted grid, rising bokeh, floating chests / coins */
.deco .rays{position:absolute;left:50%;top:42%;width:calc(900px*var(--k));height:calc(900px*var(--k));margin:calc(-450px*var(--k)) 0 0 calc(-450px*var(--k));border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.24) 0 7deg,transparent 7deg 20deg,rgba(37,244,238,.18) 20deg 27deg,transparent 27deg 40deg,rgba(254,44,85,.14) 40deg 47deg,transparent 47deg 60deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 62%);mask-image:radial-gradient(circle,#000 8%,transparent 62%);will-change:transform;animation:spin 40s linear infinite}
.deco .dotgrid{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;background-image:radial-gradient(rgba(22,24,35,.08) 1.4px,transparent 1.7px);background-size:calc(22px*var(--k)) calc(22px*var(--k));will-change:transform;animation:pan 14s linear infinite}
.deco .bokeh{position:absolute;bottom:-70px;border-radius:50%;opacity:.85;will-change:transform;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95) 0 12%,var(--c,rgba(37,244,238,.4)) 45%,transparent 72%);animation:bubble linear infinite}
.deco .float{position:absolute;display:block;opacity:.22;will-change:transform;animation:floaty 8s ease-in-out infinite}
.screen .deco .float{opacity:.28}
.deco .float img{display:block;width:100%;height:auto}
@keyframes bubble{0%{transform:translate(0,0) scale(.7)}50%{transform:translate(18px,-55vh) scale(1)}100%{transform:translate(0,-115vh) scale(.8);opacity:0}}
@keyframes pan{to{transform:translate(calc(22px*var(--k)),calc(22px*var(--k)))}}
/* final balance card (game's own style) */

  box-shadow:calc(-4px*var(--k)) 0 0 var(--cyan),calc(4px*var(--k)) 0 0 var(--red),0 calc(20px*var(--k)) calc(40px*var(--k)) rgba(22,24,35,.16)}

<body>
<div class="rotate"><i>📱</i><span id="rotateText"></span></div>
<div class="app">
<div class="game" id="game">
  <div class="deco" id="gameDeco"></div>
  <div class="coins" id="coinPill"><span class="coin" data-coin></span><span id="coins">0</span></div>
  <div class="winbar"><span id="winbarText">WIN &amp; GET</span><span class="coin" data-coin></span><b id="winTotal">15,000</b></div>

  <canvas id="board"></canvas>
  <div class="hint" id="hint"></div>

  <div class="pad" id="pad">
    <button class="u" data-dir="up" type="button" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M12 6l7 9H5z"/></svg></button>
    <button class="l" data-dir="left" type="button" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M6 12l9-7v14z"/></svg></button>
    <button class="d" data-dir="down" type="button" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M12 18l7-9H5z"/></svg></button>
    <button class="r" data-dir="right" type="button" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M18 12l-9-7v14z"/></svg></button>
  </div>

  <!-- intro -->
  <section class="screen" id="intro">
    <div class="deco" data-coins></div>
    <div class="train"><img data-chest-img alt=""><img data-chest-img alt=""><img data-chest-img alt=""><img data-chest-img alt=""><span class="coin" data-coin></span></div>
    <h1 id="introTitle"></h1>
    <p class="goal" id="introGoal"></p>
    <div class="how">
      <div><span>🚂</span><em id="how1"></em></div>
      <div><span>👆</span><em id="how2"></em></div>
      <div><span>🎁</span><em id="how3"></em></div>

    <div class="actions"><button class="btn y pulse" id="play" type="button"></button></div>
  </section>

  <!-- oops (bumped into own tail) -->
  <section class="modal" id="oops" hidden>
    <div class="pane">
      <h2 id="oopsTitle"></h2>
      <p id="oopsText"></p>
    </div>
    <div class="actions"><button class="btn y" id="goOn" type="button"></button></div>
  </section>

  <!-- congratulations + nickname: one screen -->
  <section class="modal" id="win" hidden>
    <div class="pane">
      <h2 id="winTitle"></h2>
      <img class="big" data-chest-img alt="">
      <div class="reward"><span>+<span id="rewardNum">0</span></span><span class="coin" data-coin></span></div>

      <div class="w-bar"><i id="walletBar"></i></div>

<script>
/* =====================================================================
   CHEST SNAKE — one self-contained file, no libraries.
   Works on any phone, tablet or browser: full screen on phones and tablets
   (everything scales up on big screens), a centred phone on computers.
   The snake is made of chests: every coin eaten adds one more chest.
   To customise, change only the SETTINGS below and, if you like, the
   pictures in window.MEDIA at the very end of the file.
   ===================================================================== */
/* ============================ SETTINGS ============================ */
var CONFIG = {
  startCoins: 0,
  coinValue: 5000,      // coins added to the balance for every coin eaten
  coinsOnField: 3,      // coins on the board = coins needed to win (all lie on the board from the start)
  cols: 6, rows: 7,     // small board, in cells
  maxCell: 48,          // biggest cell in px on a phone (scaled up on tablets)
  startLength: 2,       // chests at the start
  speed: 300,           // ms per step (lower = faster)
  magnet: 0,            // 0 = the chest must touch the coin (1 = coins jump in from the next cell)
  autoStart: 700,       // ms after Play the snake starts moving by itself (0 = wait for a tap)
  autoSteer: false,     // true: the snake always turns toward the next coin by itself
  assistOnPress: true,  // any arrow tap = the snake steers itself to the next coin
  assistSteps: 4,       // how many steps one tap keeps steering
  manualSteps: 2,       // after an arrow tap, auto-steer waits this many steps
  wrapWalls: true,      // true: go through a wall and come out on the other side
  selfCollision: false, // true: biting your own chests ends the round
  text: {
    intro: 'Chest Snake', goal: 'Collect 3 coins — grow your chest train!', play: 'Play',
    how1: 'Tap any arrow', how2: 'The chests steer to the coin by themselves', how3: 'Collect all COUNT coins to win',
    hint: 'Tap any arrow — the chests find the coin', winbar: 'WIN & GET',
    praise: ['Nice!', 'Great!', 'Jackpot!'],
    oops: 'Oops!', oopsText: "Don't bite your own chests. Your coins are safe!", goOn: 'Continue',
    win: 'Chest train complete!', again: 'Play again',
    askText: "Enter your nickname and we'll transfer the coins to your account",
    rotate: 'Turn your phone upright to play'
  },
  prankText: 'Это пранк, и всё это нереально',
  prankNote: 'The coins are not real. Thanks for playing!'
};
/* ================================================================== */

window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (cb) { return setTimeout(function () { cb(Date.now()); }, 16); };
if (window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;
if (window.Element && !Element.prototype.remove) Element.prototype.remove = function () { if (this.parentNode) this.parentNode.removeChild(this); };

document.addEventListener('DOMContentLoaded', function () {
  var MEDIA = window.MEDIA || {}, T = CONFIG.text;
  function $(id) { return document.getElementById(id); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function ri(n) { return Math.floor(Math.random() * n); }
  function num(n) { return Math.max(0, Math.round(n)).toLocaleString('en-US'); }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  var game = $('game'), cv = $('board'), ctx = cv.getContext('2d');

  /* ---------- Static text and pictures ---------- */
  var COIN = '<img src="' + MEDIA.coin + '" alt="" draggable="false">';
  document.querySelectorAll('[data-coin]').forEach(function (el) { el.innerHTML = COIN; });
  document.querySelectorAll('[data-chest]').forEach(function (el) { el.innerHTML = '<img src="' + MEDIA.chest + '" alt="" draggable="false">'; });
  document.querySelectorAll('[data-chest-img]').forEach(function (el) { el.src = MEDIA.chest; el.draggable = false; });
  T.how3 = T.how3.replace('COUNT', CONFIG.coinsOnField);
  var setText = { winbarText: 'winbar', introTitle: 'intro', introGoal: 'goal', play: 'play', how1: 'how1', how2: 'how2', how3: 'how3', hint: 'hint',
    oopsTitle: 'oops', oopsText: 'oopsText', goOn: 'goOn', winTitle: 'win', again: 'again',
    askText: 'askText', rotateText: 'rotate' };
  Object.keys(setText).forEach(function (id) { $(id).textContent = T[setText[id]]; });
  $('prankText').textContent = CONFIG.prankText; $('prankNote').textContent = CONFIG.prankNote;
  var imgChest = new Image(), imgCoin = new Image();
  imgChest.src = MEDIA.chest; imgCoin.src = MEDIA.coin;

  /* ---------- Balance (rolling counter) and goal ---------- */
  var COUNT = CONFIG.coinsOnField, coins = CONFIG.startCoins, eaten = 0;
  // A number that rolls up smoothly. An invisible copy of the final number keeps the width fixed, so nothing jumps while it counts.
  function roll(el, to, ms, from, delay) {
    if (!el._ready) { el._ready = true; el._cur = 0; el.className += ' roll'; el.innerHTML = '<span class="g">0</span><span class="v">0</span>'; }
    var g = el.firstChild, v = el.lastChild, t0 = Date.now() + (delay || 0), id = el._id = (el._id || 0) + 1;
    if (typeof from === 'number') el._cur = from;
    var a = el._cur;
    g.textContent = num(to); v.textContent = num(a);
    (function tick() {
      if (id !== el._id) return;
      var p = ms ? Math.max(0, Math.min(1, (Date.now() - t0) / ms)) : 1, e = 1 - Math.pow(1 - p, 3);
      el._cur = p >= 1 ? to : a + (to - a) * e;
      v.textContent = num(el._cur);
      if (p < 1) requestAnimationFrame(tick);
    })();
  }
  function showCoins() { roll($('coins'), coins, 0); }
  function addCoins(n) { coins += n; roll($('coins'), coins, 700); replay($('coinPill'), 'bump'); }
  $('winTotal').textContent = num(COUNT * CONFIG.coinValue);   // "WIN & GET 15,000"
  showCoins();

  /* ---------- Background decoration (glow blobs, sparkles, floating coins) ---------- */
  function decorate(el, withCoins) {
    var html = '<div class="rays"></div><div class="dotgrid"></div><i class="blob b1"></i><i class="blob b2"></i>';
    var cols = ['rgba(37,244,238,.45)', 'rgba(254,44,85,.35)', 'rgba(255,200,61,.5)'];
    for (var i = 0; i < 6; i++) {
      var sz = rand(14, 46).toFixed(0);
      html += '<i class="bokeh" style="left:' + rand(0, 95).toFixed(1) + '%;width:calc(' + sz + 'px*var(--k));height:calc(' + sz + 'px*var(--k));--c:' + cols[i % 3] +
        ';animation-duration:' + rand(9, 16).toFixed(1) + 's;animation-delay:' + (-rand(0, 16)).toFixed(1) + 's"></i>';
    }
    // floating chests behind the game, floating coins on the other screens
    var pic = withCoins ? COIN : '<img src="' + MEDIA.chest + '" alt="" draggable="false">';
    for (var j = 0; j < 4; j++) html += '<b class="float" style="left:' + rand(2, 88).toFixed(1) + '%;top:' + rand(4, 88).toFixed(1) + '%;width:calc(' +
      (withCoins ? rand(18, 34) : rand(30, 52)).toFixed(0) + 'px*var(--k));animation-delay:' + (-rand(0, 8)).toFixed(1) + 's;animation-duration:' + rand(6, 10).toFixed(1) + 's">' + pic + '</b>';
    el.innerHTML = html;
  }
  document.querySelectorAll('.deco').forEach(function (el) { decorate(el, el.hasAttribute('data-coins')); });

  /* ---------- Board (small, fits any screen) ---------- */
  var COLS = CONFIG.cols, ROWS = CONFIG.rows, CELL = 40, BX = 0, BY = 0, DPR = 1;
  var dots = [];
  var boardC = null;
  for (var di = 0; di < 14; di++) dots.push({ x: rand(0, COLS), y: rand(0, ROWS), p: rand(0, 6.28), s: rand(.5, 1.3) });
  function layout() {
    var w = game.clientWidth, h = game.clientHeight;
    // one size scale for every screen: phones = 1, tablets up to 1.8
    var k = Math.max(1, Math.min(1.8, w / 390, h / 700));
    document.documentElement.style.setProperty('--k', k.toFixed(3));
    var pad = $('pad'), top = $('coinPill').offsetTop + 128 * k;                       // under balance + WIN & GET plate
    var bottom = pad.offsetHeight + (parseFloat(getComputedStyle(pad).bottom) || 0) + 28 * k;  // arrows + hint line
    var ah = h - top - bottom;
    CELL = Math.floor(Math.max(22, Math.min((w - 60 * k) / COLS, ah / ROWS, CONFIG.maxCell * k)));
    var bw = CELL * COLS, bh = CELL * ROWS;
    BX = Math.round((w - bw) / 2); BY = Math.round(top + Math.max(0, (ah - bh) / 2));
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(bw * DPR); cv.height = Math.round(bh * DPR);
    cv.style.width = bw + 'px'; cv.style.height = bh + 'px';
    cv.style.left = BX + 'px'; cv.style.top = BY + 'px';
    cv.style.borderRadius = Math.round(CELL * .35) + 'px';
    var rays = document.querySelector('#gameDeco .rays'); if (rays) { rays.style.left = (BX + bw / 2) + 'px'; rays.style.top = (BY + bh / 2) + 'px'; }
    $('hint').style.top = (BY + bh + 10 * k) + 'px';
    boardC = boardC || document.createElement('canvas'); boardC.width = cv.width; boardC.height = cv.height;
    var mc = ctx; ctx = boardC.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); paintBoard(bw, bh); ctx = mc;
    draw(1);
  }

  /* ---------- Snake of chests ---------- */
  var DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
  var snake = [], prev = [], dir = DIRS.up, queue = [], pile = [], guide = [], target = null;
  var parts = [], rings = [], sucks = [], headX = 0, headY = 0;
  var running = false, started = false, halt = false, acc = 0, last = 0, stepMs = CONFIG.speed, bite = 0;
  var guideFirst = null, manual = 0, assist = 0, startTimer = null;
  function nameOf(d) { for (var n in DIRS) if (DIRS[n] === d) return n; return null; }
  function resetSnake() {
    var cx = Math.floor(COLS / 2), cy = ROWS - CONFIG.startLength - 1;
    snake = []; for (var i = 0; i < CONFIG.startLength; i++) snake.push({ x: cx, y: cy + i });
    prev = snake.map(function (p) { return { x: p.x, y: p.y }; });
    dir = DIRS.up; queue = []; acc = 0; started = false;
  }
  function occupied(x, y) { for (var i = 0; i < snake.length; i++) if (snake[i].x === x && snake[i].y === y) return true; return false; }
  function dist(a, b, n) { var d = Math.abs(a - b); return CONFIG.wrapWalls ? Math.min(d, n - d) : d; }
  function near(c, x, y) { return dist(c.x, x, COLS) + dist(c.y, y, ROWS) <= CONFIG.magnet; }
  // coins go to easy, obvious spots: straight ahead first, then to one side on the same row, then just below that
  function spawnCoins(n) {
    var h = snake[0], list = [], side = Math.random() < .5 ? -1 : 1, c;
    function ok(c) {
      if (c.x < 0 || c.y < 0 || c.x >= COLS || c.y >= ROWS || occupied(c.x, c.y)) return false;
      for (var q = 0; q < list.length; q++) if (list[q].x === c.x && list[q].y === c.y) return false;
      return true;
    }
    var spots = [[0, -3], [2 * side, -3], [2 * side, -1], [-2 * side, -3], [-2 * side, -1], [0, -5]];
    for (var i = 0; i < spots.length && list.length < n; i++) { c = { x: h.x + spots[i][0], y: h.y + spots[i][1] }; if (ok(c)) list.push(c); }
    var tries = 0; while (list.length < n && tries++ < 300) { c = { x: ri(COLS), y: ri(ROWS) }; if (ok(c)) list.push(c); }  // other board sizes
    list.forEach(function (c, k) { c.born = Date.now() + 250 + k * 220; });
    pile = list; updateGuide();
  }
  // shortest way to the nearest coin: drawn as a dotted trail, and the arrow button to press glows
  function updateGuide() {
    guide = []; target = null; guideFirst = null;
    var tip = null;
    if (pile.length && snake.length && !halt) {
      var h = snake[0], cur = queue.length ? queue[queue.length - 1] : dir, seen = {}, q = [h], found = null;
      var order = ['up', 'left', 'right', 'down'].sort(function (a, b) { return (DIRS[b] === cur) - (DIRS[a] === cur); });  // prefer going straight
      seen[h.y * COLS + h.x] = true;
      while (q.length && !found) {
        var p = q.shift();
        for (var i = 0; i < 4 && !found; i++) {
          var d = DIRS[order[i]];
          if (p === h && d.x === -cur.x && d.y === -cur.y) continue;              // can't turn back
          var nx = p.x + d.x, ny = p.y + d.y;
          if (CONFIG.wrapWalls) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
          else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
          if (seen[ny * COLS + nx]) continue; seen[ny * COLS + nx] = true;
          var node = { x: nx, y: ny, from: p, first: p === h ? order[i] : p.first };
          for (var j = 0; j < pile.length; j++) if (near(pile[j], nx, ny)) { found = node; target = pile[j]; break; }
          q.push(node);
        }
      }
      if (found) {
        tip = guideFirst = found.first;
        for (var c = found; c && c !== h; c = c.from) guide.unshift({ x: c.x, y: c.y });
        if (target.x !== found.x || target.y !== found.y) guide.push({ x: target.x, y: target.y });
        if (started && tip === nameOf(cur)) tip = null;                           // already going the right way
      }
    }
    var btns = document.querySelectorAll('.pad button');
    for (var b = 0; b < btns.length; b++) btns[b].classList.toggle('tip', btns[b].getAttribute('data-dir') === tip);
  }
  function turn(name) {
    var d = DIRS[name]; if (!d || !running || halt) return;
    if (CONFIG.assistOnPress) {                          // tap = auto-steer to the coin for a few steps
      $('hint').classList.add('off');
      if (!started) { started = true; acc = stepMs * .75; }
      assist = CONFIG.assistSteps; queue = []; updateGuide(); return;
    }
    if (!started) {                                       // the snake waits for the first tap
      if (d.x === -dir.x && d.y === -dir.y) return;
      started = true; queue = [d]; acc = stepMs * .75; manual = CONFIG.manualSteps; $('hint').classList.add('off'); updateGuide(); return;
    }
    var lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (d === lastDir || (d.x === -lastDir.x && d.y === -lastDir.y)) return;  // no turning back into yourself
    if (queue.length < 2) queue.push(d);
    manual = CONFIG.manualSteps; $('hint').classList.add('off');
    updateGuide();
  }
  function step() {
    if (queue.length) dir = queue.shift();
    else if (((CONFIG.autoSteer && manual <= 0) || assist > 0) && guideFirst) dir = DIRS[guideFirst];
    if (assist > 0) assist--;   // auto-steer toward the next coin
    if (manual > 0) manual--;
    var h = snake[0], nx = h.x + dir.x, ny = h.y + dir.y, i;
    if (CONFIG.wrapWalls) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
    else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return crash();
    var got = [];
    for (i = 0; i < pile.length; i++) if (near(pile[i], nx, ny)) got.push(i);      // the magnet pulls in coins next to the head
    if (CONFIG.selfCollision) for (i = 0; i < snake.length - (got.length ? 0 : 1); i++) if (snake[i].x === nx && snake[i].y === ny) return crash();
    prev = snake.map(function (p) { return { x: p.x, y: p.y }; });
    snake.unshift({ x: nx, y: ny });
    if (got.length) {
      for (i = got.length - 1; i >= 0; i--) eat(got[i]);
      for (i = 1; i < got.length; i++) { var tl = snake[snake.length - 1]; snake.push({ x: tl.x, y: tl.y }); }   // one chest per coin
    } else snake.pop();
    for (i = 0; i < 2; i++) parts.push({ x: (h.x + .5) * CELL + rand(-6, 6), y: (h.y + .5) * CELL + rand(-6, 6), vx: rand(-.4, .4), vy: rand(-.8, -.2), life: .7, kind: 'star', rot: rand(0, 6), vr: .1, col: i ? '#25f4ee' : '#ffc83d', s: .5, g: 0 });
    updateGuide();
  }
  function eat(i) {
    var c = pile.splice(i, 1)[0];
    bite = Date.now(); eaten++; vibrate(15);
    var bx = (c.x + .5) * CELL, by = (c.y + .5) * CELL, px = BX + bx, py = BY + by;
    burst(bx, by); sucks.push({ x: bx, y: by, t0: Date.now() });
    plus(px, py, '+' + num(CONFIG.coinValue)); flyCoin(px, py);
    praise(T.praise[Math.min(eaten, T.praise.length) - 1]);
    if (eaten >= COUNT) { halt = true; updateGuide(); setTimeout(win, 1300); }   // let the last step and the counter finish first
  }
  function crash() {
    halt = true; vibrate([40, 40, 40]);
